<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="supported-color-schemes" content="dark">
<title>{{subject}}</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url({{site}}/fonts/space-grotesk-latin.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:100 900;src:url({{site}}/fonts/inter-latin.woff2) format('woff2')}
</style>
</head>
<body style="margin:0;padding:0;background:#15171a">
<div style="display:none;max-height:0;overflow:hidden">{{preview}}</div>
<div style="background:#15171a;padding:0 24px">
<div style="max-width:520px;margin:0 auto;padding:44px 0 40px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#c9ccd4">
  <a href="{{site}}/" style="text-decoration:none"><img src="{{site}}/icon-192.png" width="56" height="56" alt="leolem.dev" style="display:block;border:0;border-radius:12px;margin-bottom:36px"></a>
{{#articles}}  <p style="margin:0;font-size:17px;color:#e8e9ec">{{note}}</p>
  <div style="margin:24px 0 44px;border-radius:14px;overflow:hidden;background:#1d2026;border:1px solid #2e323a">
    <a href="{{url}}" style="display:block;text-decoration:none"><img src="{{image}}" width="520" alt="" style="display:block;width:100%;height:auto;border:0"></a>
    <div style="padding:22px 24px 26px">
      <h2 style="margin:0 0 10px;font-family:'Space Grotesk',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;letter-spacing:-.01em;font-weight:500"><a href="{{url}}" style="color:#e8e9ec;text-decoration:none">{{title}}</a></h2>
      <p style="margin:0 0 20px;font-size:15px;color:#b9bec9">{{summary}}</p>
      <a href="{{url}}" style="display:inline-block;padding:11px 20px;border-radius:999px;background:#A05070;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px">Read it &rarr;</a>
    </div>
  </div>
{{/articles}}  <p style="margin:0;color:#e8e9ec">Thanks for reading!<br>Leo</p>
  <p style="margin:44px 0 0;padding-top:20px;border-top:1px solid #2e323a;font-size:13px;line-height:1.6;color:#7d8390">You get this because you signed up at <a href="{{site}}/" style="color:#9aa0ad;text-decoration:none">leolem.dev</a>. <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" style="color:#9aa0ad">Unsubscribe</a></p>
</div>
</div>
</body>
</html>
